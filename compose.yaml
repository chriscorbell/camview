services:
  camview:
    image: ghcr.io/chriscorbell/camview:latest
    container_name: camview
    restart: unless-stopped
    ports:
      - "3147:8080"       # viewer page + WebRTC signaling
      - "8555:8555/tcp"   # WebRTC media
      - "8555:8555/udp"
    environment:
      # Frigate's restream of the Camera, so camview never opens its own Camera session.
      MAIN_STREAM_URL: rtsp://10.0.0.20:8554/front_door
      SUB_STREAM_URL: rtsp://10.0.0.20:8554/front_door_sub
      # The host's addresses, advertised to Viewers for WebRTC.
      LAN_ADDRESS: 10.0.0.20
      TAILSCALE_ADDRESS: 100.88.0.15
