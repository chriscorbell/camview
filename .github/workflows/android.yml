# The Desk display app. Every push to main that touches android/ publishes a
# signed release tagged desk-<run number>, and so does running this workflow by
# hand on main. The app on the tablet checks GitHub Releases every 15 minutes
# and installs anything newer by itself.
name: Android

on:
  pull_request:
    paths: [android/**, .github/workflows/android.yml]
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleDebug assembleRelease lint

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      CAMVIEW_RELEASE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMVIEW_ANDROID_KEYSTORE_BASE64 }}
          CAMVIEW_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.CAMVIEW_ANDROID_KEYSTORE_PASSWORD }}
          CAMVIEW_ANDROID_KEY_ALIAS: ${{ secrets.CAMVIEW_ANDROID_KEY_ALIAS }}
          CAMVIEW_ANDROID_KEY_PASSWORD: ${{ secrets.CAMVIEW_ANDROID_KEY_PASSWORD }}
        run: |
          export CAMVIEW_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$CAMVIEW_ANDROID_KEYSTORE"
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/camview-desk.apk"
      # The tablet only accepts updates signed with the key it was installed
      # with, so a release signed with anything else must never be published.
      - name: Check the signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          actual="$("$apksigner" verify --print-certs "$RUNNER_TEMP/camview-desk.apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr a-f A-F)"
          expected="$(tr -d ':\n' < release-certificate.sha256)"
          test "$actual" = "$expected" || { echo "APK is signed with $actual, expected $expected"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desk-$CAMVIEW_RELEASE" "$RUNNER_TEMP/camview-desk.apk" \
            --title "Desk display $CAMVIEW_RELEASE" \
            --notes "Built from ${GITHUB_SHA::7}. The Desk display installs this on its own." \
            --target "$GITHUB_SHA" --latest
